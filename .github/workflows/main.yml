name: Test

on:
  push:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
        
      - name: 2
        run: sudo tailscale up --authkey=${{ secrets.AUTH }} --ssh
      - name: 3
        run: sudo tailscale ip -4

      - name: 4
        run: sleep 3600
        
