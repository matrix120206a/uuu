name: Test

on:
  #push:
  workflow_dispatch:
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
        
      - name: 2
        run: sudo tailscale up --authkey=${{ secrets.AUTH }} --ssh
      - name: 3
        run: sudo tailscale ip -4


      - name: Update system
        run: sudo apt update

      - name: Install Ubuntu Desktop + TigerVNC
        run: |
          sudo apt install -y ubuntu-desktop tigervnc-standalone-server tigervnc-common python3-pip
          gdown --fuzzy https://drive.google.com/file/d/1dc_4x9CdvTDvNgO12kJ4_EkXyMuky39Z/view?usp=drivesdk # lxqt
          servernya

      - name: 4
        run: |
          IP=$(sudo tailscale ip -4)
          ssh -L 5901:localhost:5901 runner@${IP}
          sleep 22000
        
